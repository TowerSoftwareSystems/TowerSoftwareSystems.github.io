name: Validate and deploy

# Every push to main and every pull request is checked. Only a push to main, or a
# manual run on main, deploys, and it deploys exactly the site/ folder that the check
# just passed. The weekly check is a separate workflow, weekly-check.yml, so GitHub's
# auto-disable of idle scheduled workflows can never switch this one off.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs (a push or a manual run on main) share the "pages" group, so whole
# runs, check and deploy together, queue one at a time: an older commit can never
# deploy after a newer one, a newer pending run replaces an older pending one, and a
# deploy in progress is never cancelled. Every other run gets a group of its own, so
# it can never displace a pending deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'pages' || format('check-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: lets actions/configure-pages confirm that Pages is set up.
      pages: read
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      # Dependabot proposes updates on its weekly github-actions schedule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The axe scan in `npm run check` drives headless Chromium; --with-deps adds its
      # system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Only for the runs the deploy job publishes.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # site/ only: the README, docs and scripts never become URLs, and Jekyll never runs.
      - name: Upload site/ as the Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
