name: Validate and deploy

# Every push and pull request is checked. Only a push to main, or a manual run on
# main, deploys, and it deploys exactly the site/ folder that the check just passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new advisory or a browser change surfaces even when nobody pushes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: lets actions/configure-pages confirm that Pages is set up.
      pages: read
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      # Dependabot proposes updates on its weekly github-actions schedule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The axe scan in `npm run check` drives headless Chromium; --with-deps adds its
      # system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # site/ only: the README, docs and scripts never become URLs, and Jekyll never runs.
      - name: Upload site/ as the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One deploy at a time; a deploy in progress is never cancelled. Set on this job
    # rather than the workflow, so a queued pull-request check can never displace a
    # pending deploy from the same group.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
