name: Weekly check

# The checks from pages.yml on a weekly schedule, so a new advisory or a browser change
# surfaces even when nobody pushes. It never uploads or deploys. GitHub disables
# scheduled workflows in a public repository after 60 days without repository
# activity; `gh workflow enable weekly-check.yml` resumes this one, and the deploy
# workflow is never affected.
on:
  schedule:
    # Off the top of the hour, which GitHub names as a high-load time for schedules.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same full commit SHAs as pages.yml; Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
